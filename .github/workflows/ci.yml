name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, lint, prettier, vitest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm prettier
      - run: pnpm test

      - run: pnpm test:env:up
      - run: pnpm test:integration
      - if: always()
        run: pnpm test:env:down

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: questions-ghoul-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --entrypoint sh questions-ghoul-api:ci -c 'test -f dist/index.js && node --version'
