services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  migrate:
    profiles: ["prod-only"]

  api:
    image: questions-ghoul-api:dev
    build:
      context: .
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
