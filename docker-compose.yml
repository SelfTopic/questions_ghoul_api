
services:
  postgres:
    image: postgres:15-alpine
    container_name: ghoul_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ghoul_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ghoul_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  api:
    build: .
    container_name: ghoul_api
    ports:
      - "3300:3300"
    volumes:
      - .:/app
      - /app/node_modules 
    command: pnpm run dev 
    env_file: .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: ghoul_redis
    ports:
      - "6379:6379"
    restart: always


volumes:
  pgdata:
