# Production stack. For local development:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
x-api-env: &api-env
  env_file: .env
  environment:
    NODE_ENV: production
    PORT: 3300
    POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/ghoul_db
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379

services:
  postgres:
    # No container_name: it isn't scoped by -p like volumes are, so two
    # projects on the same host (prod + test stand) would collide on it.
    # Major version must match the existing pgdata volume.
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ghoul_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ghoul_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data
    restart: unless-stopped

  migrate:
    # Also not scoped by -p: without IMAGE_TAG, a stand build on the same host
    # would overwrite the tag prod's containers are recreated from.
    image: ${IMAGE_TAG:-questions-ghoul-api:latest}
    build: .
    <<: *api-env
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${IMAGE_TAG:-questions-ghoul-api:latest}
    build: .
    <<: *api-env
    ports:
      - "${API_PORT:-3300}:3300"
    volumes:
      # Questions are never baked into the image.
      - ./assets/data:/app/assets/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3300/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
